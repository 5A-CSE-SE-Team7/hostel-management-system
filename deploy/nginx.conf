# Reference TLS terminator + static host (HMS-SR-001: TLS 1.2+ only; HMS-NF-003 availability).
# Build the UI first:  cd frontend && npm run build   -> copy dist/ to /var/www/hms
# Run the API with:    NODE_ENV=production REQUIRE_HTTPS=true TRUST_PROXY=loopback HOST=127.0.0.1 node backend/src/server.js
server {
  listen 80;
  server_name hms.example.edu;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name hms.example.edu;

  ssl_certificate     /etc/letsencrypt/live/hms.example.edu/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hms.example.edu/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  root /var/www/hms;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { try_files $uri /index.html; }
}

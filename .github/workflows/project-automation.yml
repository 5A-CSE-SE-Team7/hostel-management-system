name: Project automation

on:
  issues:
    types: [opened, transferred]
  # Metadata-only privileged event: never checkout or execute PR code here.
  # Allows adding fork PRs without exposing the Project token to their code.
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      content_url:
        description: Full issue or PR URL to add after configuring credentials
        required: true
        type: string

permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_URL: ${{ vars.PROJECT_URL }}
      PROJECT_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
    steps:
      - name: Validate Project configuration
        shell: bash
        run: |
          if [[ -z "$PROJECT_URL" || -z "$PROJECT_TOKEN" ]]; then
            echo '::error::Configure repository Actions variable PROJECT_URL and Actions secret ADD_TO_PROJECT_PAT with access to that Project. See docs/CI_AUTOMATION.md.'
            exit 1
          fi
          if [[ ! "$PROJECT_URL" =~ ^https://github\.com/(orgs|users)/[^/]+/projects/[0-9]+/?$ ]]; then
            echo '::error::PROJECT_URL must be a GitHub organization or user Project URL.'
            exit 1
          fi
      - uses: actions/add-to-project@244f685bbc3b7adfa8466e08b698b5577571133e # v1.0.2
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
      - name: Add selected issue or PR (manual retry)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          CONTENT_URL: ${{ inputs.content_url }}
        shell: bash
        run: |
          if [[ ! "$CONTENT_URL" =~ ^https://github\.com/${GITHUB_REPOSITORY}/(issues|pull)/[0-9]+$ ]]; then
            echo '::error::content_url must identify an issue or PR in this repository.'
            exit 1
          fi
          project_path="${PROJECT_URL%/}"
          owner="${project_path%/projects/*}"
          owner="${owner##*/}"
          number="${project_path##*/}"
          gh project item-add "$number" --owner "$owner" --url "$CONTENT_URL"

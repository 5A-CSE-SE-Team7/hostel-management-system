name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  linked-issue:
    name: PR must reference a backlog issue
    runs-on: ubuntu-latest
    steps:
      - name: Check for "Closes #N" / "Fixes #N" / "Refs #N"
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?) +#[0-9]+'; then
            echo "Linked issue found."
          else
            echo "::error::Please link the backlog issue in the PR description, e.g. 'Closes #12'."
            exit 1
          fi

# Local MySQL for development:  docker compose up -d
# The schema in backend/db/schema.sql is loaded automatically on first start.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: hms
      MYSQL_USER: hms
      MYSQL_PASSWORD: hms_pass
    ports: ["3306:3306"]
    volumes:
      - hms_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uhms", "-phms_pass"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  hms_data:
